name: CI

on:
  pull_request:
  push:
    branches: [main, component-versions]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build and unit test
        run: mvn -B verify
      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'

  integration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dse: '5.1.31'
            cassandra: '3.11.19'
    name: integration (DSE ${{ matrix.dse }}, Cassandra ${{ matrix.cassandra }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Integration tests
        run: >-
          mvn -B verify -Pintegration
          -Ddse.image=datastax/dse-server:${{ matrix.dse }}
          -Dcassandra.image=cassandra:${{ matrix.cassandra }}
      - name: Upload integration test reports and container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-dse-${{ matrix.dse }}-cassandra-${{ matrix.cassandra }}
          path: |
            integration-tests/target/failsafe-reports
            integration-tests/target/container-logs
          if-no-files-found: ignore
